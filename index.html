<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>찐알렉스 피하기</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- Three.js 를 CDN 에서 불러옴 (버전 고정) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- 화면 가장자리를 살짝 어둡게 (비네트) -->
  <div id="vignette"></div>

  <!-- 조준점 -->
  <div id="crosshair"></div>

  <div id="hud">
    <!-- 왼쪽 위: 지금 있는 방 -->
    <div id="hud-room" class="card">
      <div class="tag">현재 위치</div>
      <div class="room-row"><span id="room-name">복도</span></div>
    </div>

    <!-- 오른쪽 위: 미니맵 (mapData 에서 자동 생성) -->
    <div id="hud-map" class="card"><canvas id="minimap"></canvas></div>

    <!-- 왼쪽 아래: 이동 상태 -->
    <div id="hud-move" data-mode="walk">
      <span class="seg" data-m="quiet">조용히</span>
      <span class="seg" data-m="walk">걷기</span>
      <span class="seg" data-m="run">달리기</span>
    </div>

    <!-- 아래 가운데: 조작 안내 -->
    <div id="hud-keys">
      <div class="hint"><span class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span class="label">이동</span></div>
      <div class="hint"><span class="keys"><kbd>마우스</kbd></span><span class="label">시점</span></div>
      <div class="hint"><span class="keys"><kbd>Shift</kbd></span><span class="label">달리기</span></div>
      <div class="hint"><span class="keys"><kbd>우클릭</kbd></span><span class="label">조용히</span></div>
      <div class="hint"><span class="keys"><kbd>ESC</kbd></span><span class="label">일시정지</span></div>
    </div>

    <!-- 오른쪽 아래: 좌표와 방 이름 (실제 배치도와 맞출 때 사용) -->
    <div id="hud-pos"></div>
  </div>

  <!-- 시작 / 일시정지 화면 -->
  <div id="overlay">
    <div class="panel">
      <h1>찐알렉스 피하기</h1>
      <div class="rule"></div>
      <p id="overlay-msg" class="start">화면을 클릭하면 시작해요</p>
      <div class="controls">
        <div class="row"><span class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span class="desc">이동</span></div>
        <div class="row"><span class="keys"><kbd>마우스</kbd></span><span class="desc">시점 돌리기</span></div>
        <div class="row"><span class="keys"><kbd>Shift</kbd></span><span class="desc">누르고 있는 동안 달리기</span></div>
        <div class="row"><span class="keys"><kbd>오른쪽 버튼</kbd></span><span class="desc">누르고 있는 동안 조용히 걷기</span></div>
        <div class="row"><span class="keys"><kbd>ESC</kbd></span><span class="desc">일시정지 (마우스 풀기)</span></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
